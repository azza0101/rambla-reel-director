name: Premontato package
on:
  pull_request:
    paths:
      - 'premontato-workflow/**'
  workflow_dispatch:
  push:
    tags:
      - 'premontato-v*'
jobs:
  package-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: premontato-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test Resolve adapter and plugin logic
        run: node --test tests/unit/*.test.cjs
      - name: Test worker logic
        run: |
          python -m pip install pytest -r worker/requirements.txt
          python -m pytest tests/unit -q
      - name: Test package contract
        run: python -m pytest tests/unit/test_package_contract.py -q
      - name: Build self-contained installer
        shell: pwsh
        run: |
          ./tools/build_runtime.ps1 -OutputPath ./.build-runtime
          ./tools/build_installer.ps1 -RuntimePath ./.build-runtime -OutputPath ./dist/Install-Premontato.exe
          ./tools/build_update.ps1 -RuntimePath ./.build-runtime -OutputDirectory ./dist
      - name: Verify release payload excludes private inputs and SDK binary
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/Install-Premontato.exe
          if ($exe.Length -lt 20MB) { throw 'Installer payload unexpectedly small' }
          if (Get-ChildItem -Recurse -File | Where-Object { $_.Name -eq 'WorkflowIntegration.node' }) { throw 'SDK binary must not be in the checkout' }
          if (Test-Path ./FILES) { throw 'User media/script inputs must not be packaged from FILES/' }
      - uses: actions/upload-artifact@v4
        with:
          name: Premontato-Windows-x64
          path: |
            premontato-workflow/dist/Install-Premontato.exe
            premontato-workflow/dist/Premontato-*.zip
            premontato-workflow/dist/premontato-update.json
          if-no-files-found: error
          retention-days: 30
  publish-release:
    if: startsWith(github.ref, 'refs/tags/premontato-v')
    needs: package-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Premontato-Windows-x64
          path: dist
      - name: Publish private GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" ./dist/Install-Premontato.exe ./dist/Premontato-*.zip ./dist/premontato-update.json --target "$env:GITHUB_SHA" --title "Premontato $env:GITHUB_REF_NAME" --notes "Installer Windows e pacchetto aggiornamento verificato per il plugin Resolve."

