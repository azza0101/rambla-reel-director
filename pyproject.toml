[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rambla-reel-director"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.46,<0.47",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "rfc8785",
    "httpx>=0.27,<0.28",
    "playwright>=1.54,<2",
    "yt-dlp>=2025.8.22",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "anyio>=4,<4.15",
    "jsonschema>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.setuptools.packages.find]
include = ["backend*"]
