name: v0047 Resolve title regression

on:
  push:
    branches:
      - feat/api-first-text-first-v1

jobs:
  resolve-v0047:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Resolve title regression tests
        shell: bash
        run: |
          pytest -q \
            tests/unit/test_resolve_title_templates.py \
            tests/unit/test_resolve_title_template_api.py \
            tests/unit/test_resolve_handoff_jobs.py \
            tests/unit/test_resolve_combined_timeline_api.py \
            tests/unit/test_resolve_textplus_timeline.py::test_selective_title_refresh_mutes_prior_rmbl_titles_across_style_changes \
            tests/unit/test_resolve_textplus_timeline.py::test_selected_title_name_is_required_and_preserved
      - name: Compile backend
        run: python -m compileall backend
      - name: Check embedded UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from backend.app.curation_ui_v2 import render_curation_page_v2
          html = render_curation_page_v2('v0047-ci')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1
          Path('/tmp/rambla-curation.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/rambla-curation.js
