name: B ROLL v0126 handoff delivery regression
on:
  push:
    branches:
      - fix/broll-v0126-handoff-delivery
  pull_request:
    branches:
      - release/broll-v0125-publish
jobs:
  bridge-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Test bridge, handoff, app and installer contracts
        run: python -m pytest -q tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_resolve_handoff_ui.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_bridge.py tests/unit/test_resolve_prepare_jobs.py tests/unit/test_resolve_combined_timeline_api.py tests/unit/test_windows_distribution.py tests/unit/test_broll_media_pack_v0125.py
      - name: Compile Python
        run: python -m compileall -q backend/app tools/resolve_bridge
