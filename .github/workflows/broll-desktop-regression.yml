name: B ROLL desktop and Director validation regression
on:
  push:
    branches:
      - fix/broll-media-pack-selective-skip-v0125
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'pytest>=8,<9'
      - name: Targeted Director and desktop tests
        run: |
          python -m pytest -q tests/unit/test_broll_media_pack_v0125.py tests/unit/test_broll_ignore_coverages.py tests/unit/test_broll_manual_coverage.py tests/unit/test_broll_scroll_preservation.py tests/unit/test_broll_desktop_controls.py tests/unit/test_api_first_director.py tests/unit/test_api_director_curation.py tests/unit/test_debug_run_cli.py tests/unit/test_software_update.py
      - name: Python compilation
        run: python -m compileall -q backend/app
