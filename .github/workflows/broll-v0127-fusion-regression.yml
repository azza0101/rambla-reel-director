name: B ROLL v0127 Fusion and conform cache regression
on:
  push:
    branches:
      - fix/broll-v0127-fusion-slow-pc
  pull_request:
    branches:
      - release/broll-v0126-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Validate Resolve timing, Fusion and protected media
        run: python -m pytest -q tests/unit/test_resolve_textplus_timeline.py tests/unit/test_resolve_title_templates.py tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_native_cut.py tests/unit/test_broll_media_pack_v0125.py
      - name: Compile Python
        run: python -m compileall -q backend/app tools/resolve_bridge
