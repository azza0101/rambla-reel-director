name: B ROLL v0128 empty-timeline preflight regression
on:
  push:
    branches:
      - fix/broll-v0128-empty-timeline-preflight
  pull_request:
    branches:
      - release/broll-v0127-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Check empty timeline preflight and Resolve safety
        run: python -m pytest -q tests/unit/test_resolve_textplus_timeline.py tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_title_templates.py tests/unit/test_broll_media_pack_v0125.py
      - name: Compile code
        run: python -m compileall -q backend/app tools/resolve_bridge
