name: Online sourcing tests

on:
  push:
    branches:
      - feat/online-sourcing-engine-v1
      - feat/asr-resolve-benchmark-v2
      - feat/resolve-panel-safe-v1
      - feat/taste-engine-core-v1
      - feat/editorial-intelligence-style-dna-v1
      - feat/vertical-social-dense-coverage
      - feat/curation-ui-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "feat/vertical-social-dense-coverage" || "$GITHUB_REF_NAME" == "feat/curation-ui-v1" ]]; then
            pytest -q \
              tests/unit/test_dense_coverage.py \
              tests/unit/test_vertical_social.py \
              tests/unit/test_vertical_social_style_v2.py \
              tests/unit/test_youtube_source.py \
              tests/unit/test_retrieval_quality.py \
              tests/unit/test_retrieval_diagnostics_states.py \
              tests/unit/test_online_sourcing.py \
              tests/unit/test_editorial_relevance_v2.py \
              tests/unit/test_project_manifest_v2.py \
              tests/unit/test_legacy_project_open_api.py \
              tests/unit/test_project_library.py \
              tests/unit/test_media_cleanup.py \
              tests/unit/test_beat_research.py \
              tests/unit/test_beat_research_worker.py \
              tests/unit/test_project_maintenance_api.py \
              tests/unit/test_curation_product_v2.py \
              tests/unit/test_curation_project.py \
              tests/unit/test_curation.py \
              tests/unit/test_curation_ui.py \
              tests/test_debug_server.py
          else
            pytest -q
          fi
      - name: Check embedded curation JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from backend.app.curation_ui import render_curation_page
          html = render_curation_page('ci')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1
          Path('/tmp/rambla-curation.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/rambla-curation.js
      - name: Compile backend
        run: python -m compileall backend
