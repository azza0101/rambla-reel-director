name: Online sourcing tests

on:
  pull_request:
    branches:
      - feat/curation-ui-v1
  push:
    branches:
      - feat/online-sourcing-engine-v1
      - feat/asr-resolve-benchmark-v2
      - feat/resolve-panel-safe-v1
      - feat/taste-engine-core-v1
      - feat/editorial-intelligence-style-dna-v1
      - feat/vertical-social-dense-coverage
      - feat/curation-ui-v1
      - feat/api-first-text-first-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "feat/vertical-social-dense-coverage" || "$GITHUB_REF_NAME" == "feat/curation-ui-v1" || "$GITHUB_REF_NAME" == "feat/api-first-text-first-v1" ]]; then
            pytest -q \
              tests/unit/test_api_first_director.py \
              tests/unit/test_api_director_curation.py \
              tests/unit/test_dense_coverage.py \
              tests/unit/test_vertical_social.py \
              tests/unit/test_vertical_social_style_v2.py \
              tests/unit/test_browser_profiles.py \
              tests/unit/test_social_browser_source.py \
              tests/unit/test_social_acquisition.py \
              tests/unit/test_social_login_api.py \
              tests/unit/test_social_curation_ui.py \
              tests/unit/test_web_video_source.py \
              tests/unit/test_envato_source.py \
              tests/unit/test_youtube_source.py \
              tests/unit/test_retrieval_quality.py \
              tests/unit/test_retrieval_diagnostics_states.py \
              tests/unit/test_online_sourcing.py \
              tests/unit/test_editorial_relevance_v2.py \
              tests/unit/test_project_manifest_v2.py \
              tests/unit/test_legacy_project_open_api.py \
              tests/unit/test_project_library.py \
              tests/unit/test_media_cleanup.py \
              tests/unit/test_beat_research.py \
              tests/unit/test_beat_research_worker.py \
              tests/unit/test_project_maintenance_api.py \
              tests/unit/test_curation_management_ui.py \
              tests/unit/test_curation_product_v2.py \
              tests/unit/test_curation_project.py \
              tests/unit/test_curation.py \
              tests/unit/test_curation_ui.py \
              tests/test_debug_server.py
          else
            pytest -q
          fi
      - name: Full repository test suite
        if: github.ref_name == 'feat/curation-ui-v1' || github.ref_name == 'feat/api-first-text-first-v1'
        run: pytest -q
      - name: Check embedded curation JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from backend.app.curation_ui_v2 import render_curation_page_v2
          html = render_curation_page_v2('ci')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1
          Path('/tmp/rambla-curation.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/rambla-curation.js
      - name: Check acceptance launcher PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/start_curation_acceptance.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Check V5 probe PowerShell syntax
        if: github.ref_name == 'feat/api-first-text-first-v1' || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/run_api_first_v5_probe.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Compile backend
        run: python -m compileall backend
      - name: Build and smoke GPU-free cloud image
        if: github.ref_name == 'feat/api-first-text-first-v1' || github.event_name == 'pull_request'
        shell: bash
        run: |
          docker build --tag rambla-cloud-ci .
          docker run -d --name rambla-cloud-smoke -p 18080:8080 rambla-cloud-ci
          trap 'docker rm -f rambla-cloud-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/rambla-health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/rambla-health.json',encoding='utf-8'))
          assert payload['status']=='ok'
          assert payload['runtime_mode']=='cloud'
          assert payload['local_gpu_required'] is False
          assert payload['resolve_calls']==0
          PY
