name: B ROLL v0130 Resolve Fusion carrier compatibility
on:
  push:
    branches:
      - fix/broll-v0130-fusion-carrier-title-naming
  pull_request:
    branches:
      - release/broll-v0129-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Check Fusion title carriers, original import and rollback
        run: python -m pytest -q tests/unit/test_resolve_textplus_timeline.py tests/unit/test_original_video_no_autocut_v0129.py tests/unit/test_resolve_native_cut.py tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_title_templates.py tests/unit/test_export_components.py tests/unit/test_windows_distribution.py
      - name: Compile code
        run: python -m compileall -q backend/app tools/resolve_bridge
