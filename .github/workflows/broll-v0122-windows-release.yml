name: Publish RMBL B ROLL v0122 Windows package
on:
  push:
    branches:
      - release/broll-v0122-publish
permissions:
  contents: write
jobs:
  windows-build-smoke-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and product tests
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' 'pytest>=8,<9'
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
          python -m pytest -q tests/unit/test_broll_manual_coverage.py tests/unit/test_broll_scroll_preservation.py tests/unit/test_broll_desktop_controls.py tests/unit/test_api_first_director.py tests/unit/test_api_director_curation.py tests/unit/test_debug_run_cli.py tests/unit/test_software_update.py tests/unit/test_windows_distribution.py
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }
          python -m compileall -q backend/app
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
      - name: Prepare offline Windows wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.runtime-temp/release-wheels' | Out-Null
          python -m pip wheel . setuptools wheel --wheel-dir '.runtime-temp/release-wheels'
          if ($LASTEXITCODE -ne 0) { throw 'Windows wheel packaging failed' }
      - name: Build update ZIP and EXE
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH','Process')
          }
          # Chocolatey exposes a tiny shim at C:\\ProgramData\\chocolatey\\bin.
          # The release must bundle the real standalone FFmpeg binaries instead.
          $ffRoot = Join-Path $env:ChocolateyInstall 'lib/ffmpeg'
          if (Test-Path $ffRoot) {
            $actual = Get-ChildItem -LiteralPath $ffRoot -Recurse -File -Filter 'ffmpeg.exe' |
              Where-Object { Test-Path (Join-Path $_.DirectoryName 'ffprobe.exe') } |
              Select-Object -First 1
            if (-not $actual) { throw 'Real FFmpeg binaries missing from Chocolatey package' }
            $env:PATH = $actual.DirectoryName + ';' + $env:PATH
          }
          if (-not (Get-Command gh.exe -ErrorAction SilentlyContinue)) { throw 'gh CLI unavailable' }
          ./BUILD_WINDOWS_INSTALLER.ps1 -OutputDirectory (Join-Path $PWD 'dist')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'installer builder failed' }
          foreach ($name in @('RMBL-B-ROLL-Windows-v0122.zip','RMBL-B-ROLL-Setup-v0122.exe','update.json')) {
            if (-not (Test-Path (Join-Path 'dist' $name))) { throw "Missing release asset: $name" }
          }
          python tools/verify_update_archive.py 'dist/RMBL-B-ROLL-Windows-v0122.zip' 'dist/update.json'
          if ($LASTEXITCODE -ne 0) { throw 'Archive signature/paths invalid' }
      - name: Installed app smoke in temporary Windows directory
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'rmbl-v0122-stage'
          $installed = Join-Path $env:RUNNER_TEMP 'rmbl-v0122-app'
          Expand-Archive -LiteralPath 'dist/RMBL-B-ROLL-Windows-v0122.zip' -DestinationPath $stage
          & (Join-Path $stage 'INSTALL_RMBL_B_ROLL.ps1') -InstallRoot $installed -SkipDesktopIntegration -PythonExecutable (Get-Command python.exe).Source
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Installed smoke failed' }
          $exe = Join-Path $installed '.venv/Scripts/python.exe'
          & $exe -c "from backend.app.curation_server import create_app; from fastapi.testclient import TestClient; from pathlib import Path; app=create_app(project_root=Path('test-projects')); c=TestClient(app); r=c.get('/curation'); assert r.status_code == 200 and 'rmblStopAnalysis' in r.text and 'rmblSettings' in r.text; h=c.get('/api/curation/desktop-controls'); assert h.status_code == 200; print('INSTALLED_APP_SMOKE_OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Installed UI and API smoke failed' }
          if ((Get-Item 'dist/RMBL-B-ROLL-Setup-v0122.exe').Length -lt 1MB) { throw 'Empty installer' }
      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: rmbl-broll-v0122-windows-validation
          path: |
            dist/RMBL-B-ROLL-Windows-v0122.zip
            dist/RMBL-B-ROLL-Setup-v0122.exe
            dist/update.json
          retention-days: 15
      - name: Publish v0122 to GitHub release for SEARCH UPDATE
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ((Get-Content RAMBLA_VERSION -Raw).Trim() -ne 'v0122') { throw 'Unexpected version' }
          gh release create v0122 'dist/RMBL-B-ROLL-Windows-v0122.zip' 'dist/RMBL-B-ROLL-Setup-v0122.exe' 'dist/update.json' --repo "${{ github.repository }}" --target "${{ github.sha }}" --title 'RMBL B ROLL v0122 — Manual searches and stable scroll' --notes 'Maintenance update from v0121. Preserves manual B-roll search position and adds manual place/topic Pexels searches even without geographic recognition. Keeps previous settings, projects and selections; Omni-Cut unaffected.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
