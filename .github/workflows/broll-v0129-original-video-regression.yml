name: B ROLL v0129 original uploaded video without AutoCut
on:
  push:
    branches:
      - feat/broll-v0129-original-video-no-autocut
  pull_request:
    branches:
      - release/broll-v0128-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Original video, bridge, edit and distribution regressions
        run: python -m pytest -q tests/unit/test_original_video_no_autocut_v0129.py tests/unit/test_export_components.py tests/unit/test_resolve_native_cut.py tests/unit/test_resolve_textplus_timeline.py tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_combined_timeline_api.py tests/unit/test_windows_distribution.py tests/unit/test_broll_media_pack_v0125.py
      - name: Compile Python
        run: python -m compileall -q backend/app tools/resolve_bridge
