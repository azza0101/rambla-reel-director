name: Fix KURA v9 standalone final

on:
  push:
    branches:
      - feat/api-first-text-first-v1
    paths:
      - .github/workflows/fix-kura-v9-standalone-final.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-first-text-first-v1
          fetch-depth: 0

      - name: Rebuild v9 as exact renamed copy of v8
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          src = Path("backend/assets/resolve_titles/KURA_paper_title_v8.drfx")
          dst = Path("backend/assets/resolve_titles/KURA_paper_title_v9.drfx")
          old = "KURA_paper_title_v8"
          new = "KURA_paper_title_v9"

          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dst, "w") as zout:
              for info in zin.infolist():
                  data = zin.read(info.filename)
                  new_name = info.filename.replace(old, new)

                  if new_name.endswith(".setting"):
                      data = data.decode("utf-8").replace(old, new).encode("utf-8")

                  out = zipfile.ZipInfo(new_name, date_time=info.date_time)
                  out.compress_type = info.compress_type
                  out.comment = info.comment
                  out.extra = info.extra
                  out.create_system = info.create_system
                  out.create_version = info.create_version
                  out.extract_version = info.extract_version
                  out.flag_bits = info.flag_bits
                  out.volume = info.volume
                  out.internal_attr = info.internal_attr
                  out.external_attr = info.external_attr
                  zout.writestr(out, data)

          with zipfile.ZipFile(dst, "r") as z:
              assert z.testzip() is None
              names = z.namelist()
              assert f"Edit/Titles/{new}/{new}.setting" in names
              assert f"Edit/Titles/{new}/{new}.png" in names
              assert not any(old in n for n in names)
              setting = z.read(f"Edit/Titles/{new}/{new}.setting").decode("utf-8")
              assert old not in setting
              assert setting.count("setting:/") == 5

          print(dst.stat().st_size)

      - name: Commit corrected v9
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/assets/resolve_titles/KURA_paper_title_v9.drfx
          git commit -m "fix: make KURA v9 exact standalone copy of v8" || exit 0
          git push origin HEAD:feat/api-first-text-first-v1
