name: B ROLL v0131 SRT anchor and updater confirmation regression
on:
  push:
    branches:
      - fix/broll-v0131-srt-anchor-updater-dialog
  pull_request:
    branches:
      - release/broll-v0130-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Verify native SRT origin, GUI update, original A/V and Resolve guardrails
        run: python -m pytest -q tests/unit/test_resolve_native_subtitles.py tests/unit/test_software_update.py tests/unit/test_original_video_no_autocut_v0129.py tests/unit/test_resolve_textplus_timeline.py tests/unit/test_resolve_handoff.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_windows_distribution.py tests/unit/test_export_components.py
      - name: Compile Python
        run: python -m compileall -q backend/app tools/resolve_bridge
      - name: Parse Windows PowerShell updater
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './SEARCH_UPDATE.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { $errors | Out-String | Write-Error; exit 1 }
          Write-Host 'UPDATER_PARSE_OK'
