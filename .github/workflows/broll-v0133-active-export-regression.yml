name: B ROLL v0133 active timeline, export components and Envato UX
on:
  push:
    branches:
      - feat/broll-v0133-export-checklist-active-resolve-envato
  pull_request:
    branches:
      - release/broll-v0132-publish
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"
      - name: Verify active source import, bridges, UI, Envato, SRT and updater
        run: python -m pytest -q tests/unit/test_broll_active_original_and_export_ui_v0133.py tests/unit/test_original_video_no_autocut_v0129.py tests/unit/test_resolve_textplus_timeline.py tests/unit/test_resolve_handoff_jobs.py tests/unit/test_standalone_resolve_bridge.py tests/unit/test_resolve_native_cut.py tests/unit/test_resolve_native_subtitles.py tests/unit/test_export_components.py tests/unit/test_broll_update_retention_v0132.py tests/unit/test_software_update.py tests/unit/test_windows_distribution.py tests/unit/test_envato_download_bridge.py
      - name: Compile Python
        run: python -m compileall -q backend/app tools/resolve_bridge
